name = "picpocket-worker"
main = "worker.js"
compatibility_date = "2023-05-22"

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "http://localhost:3000,https://solmasta.github.io"

[[d1_databases]]
binding = "DB"
database_name = "picpocket"
database_id = "your-actual-database-id-here"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "picpocket-photos"

[build]
command = "npm run build"

[[rules]]
type = "ESModule"
globs = ["**/*.js"]

[dev]
port = 8787