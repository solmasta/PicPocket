name = "picpocket"
main = "worker.js"
compatibility_date = "2023-05-22"

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "picpocket"
database_id = "your-actual-database-id-here"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "picpocket-photos"
bucket_id = "your-actual-bucket-id-here"

[build]
command = "npm run build"

[build.upload]
format = "modules"
dir = "dist"

[[rules]]
type = "ESModule"
globs = ["**/*.js"]

[dev]
port = 8787