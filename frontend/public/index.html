<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
  <meta name="theme-color" content="#007bff" />
  <meta name="description" content="PicPocket - A privacy-focused photo storage application that runs entirely in your browser" />
  <meta name="keywords" content="photo storage, privacy, browser, offline, secure" />
  <meta name="author" content="PicPocket Team" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://solmasta.github.io/PicPocket/" />
  <meta property="og:title" content="PicPocket - Privacy-Focused Photo Storage" />
  <meta property="og:description" content="A privacy-focused photo storage application that runs entirely in your browser" />
  <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://solmasta.github.io/PicPocket/" />
  <meta property="twitter:title" content="PicPocket - Privacy-Focused Photo Storage" />
  <meta property="twitter:description" content="A privacy-focused photo storage application that runs entirely in your browser" />
  <meta property="twitter:image" content="%PUBLIC_URL%/logo512.png" />

  <!-- Security headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

  <!-- Preload critical resources -->
  <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
  
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  
  <!-- Critical CSS for faster perceived load -->
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background-color: #f5f5f5;
      color: #333;
    }
    #root {
      min-height: 100vh;
    }
    .initial-loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-size: 18px;
      color: #666;
    }
  </style>
  
  <title>PicPocket - Privacy-Focused Photo Storage</title>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root">
    <div class="initial-loading">Loading PicPocket...</div>
  </div>
  
  <!-- Service Worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('SW registered: ', registration);
          })
          .catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }
  </script>
</body>
</html>
